version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "zahern"
    # Ignore version updates for the package itself - handled by GitHub Actions
    ignore:
      - dependency-name: "SearchLibrium"
    commit-message:
      prefix: "chore(deps)"
      prefix-major: "chore(deps)!"
      include: "scope"
