[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[project]
name = "SearchLibrium"
dynamic = ["version"]
description = "A Python package for econometric models driven by search"
readme = { file = "../../README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Zeke Ahern" },
    { name = "Alexander Paz Prithvi Beeramole" },
    { name = "Robert Burdett" },
]
keywords = [
    "econometric models",
    "search",
    "discrete choice",
    "logit",
    "probit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10",
    "scikit-learn>=1.3.1",
    "statsmodels",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]

# ── bumpver configuration ───────────────────────────────────────────────────
# Used by the GitHub Actions workflow to auto-increment the patch version on
# every push to main.
[bumpver]
current_version = "0.0.72"
version_pattern = "MAJOR.MINOR.PATCH"
commit = false
tag    = false
push   = false

[bumpver.file_patterns]
"version.txt" = ["{version}"]
"pyproject.toml" = ['current_version = "{version}"']
