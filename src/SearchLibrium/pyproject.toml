[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[project]
name = "SearchLibrium"
dynamic = ["version"]
description = "A Python package for econometric models driven by search"
readme = { file = "../../README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Zeke Ahern" },
    { name = "Alexander Paz Prithvi Beeramole" },
    { name = "Robert Burdett" },
]
keywords = [
    "econometric models",
    "search",
    "discrete choice",
    "logit",
    "probit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<1.14",
    "scikit-learn>=1.3.1,<2.0",
    "statsmodels>=0.14,<1.0",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "jaxopt>=0.8.5",
]

[project.optional-dependencies]
jax = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "jaxopt>=0.8.5",
]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.5,<2.0",
    "pre-commit>=3.0,<4.0",
]
dev-full = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "black>=23.0,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.5,<2.0",
    "pre-commit>=3.0,<4.0",
]

# ── bumpver configuration ───────────────────────────────────────────────────
# Used by the GitHub Actions workflow to auto-increment the patch version on
# every push to main.
[bumpver]
current_version = "0.0.73"
version_pattern = "MAJOR.MINOR.PATCH"
commit = false
tag    = false
push   = false

[bumpver.file_patterns]
"version.txt" = ["{version}"]
"pyproject.toml" = ['current_version = "{version}"']