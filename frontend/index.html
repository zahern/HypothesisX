<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <title>Unified GUI</title>
    <!-- Plotly is loaded globally (window.Plotly) for the Output dashboard. -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
    <style>
      body {
        background-color: #0a0c10;
        color: #f1f5f9;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0px;
      }
      /* Attribute-based light override so the sub-apps can flip back to dark
         by changing the attribute. (Do NOT set inline body styles here — an
         inline background can't be overridden by the app stylesheets, which
         would leave the background stuck on a theme switch.) */
      html[dcm-studio-theme="light"] body {
        background-color: #ffffff;
        color: #0f172a;
      }
    </style>
    <script>
      // Apply the persisted light/dark theme before React mounts so the user
      // doesn't see a flash of the wrong background. Only the attribute is set
      // here; the CSS rule above paints the matching background.
      (function () {
        var t = localStorage.getItem('dcm-studio-theme');
        if (t === 'light') {
          document.documentElement.setAttribute('dcm-studio-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
