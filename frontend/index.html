<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <title>Unified GUI</title>
    <!-- Plotly is loaded globally (window.Plotly) for the Output dashboard. -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
    <style>
      body {
        background-color: #0a0c10;
        color: #f1f5f9;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0px;
      }
    </style>
    <script>
      // Apply persisted light/dark theme before React mounts so the user
      // doesn't see a flash of the wrong background. Each sub-app stores its
      // own preference under its own key (originals were preserved as-is).
      (function () {
        var t = localStorage.getItem('dcm-studio-theme') || localStorage.getItem('sa-dashboard-theme');
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.body.style.background = '#ffffff';
          document.body.style.color = '#0f172a';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
