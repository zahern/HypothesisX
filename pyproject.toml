[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SearchLibrium"
version = "0.0.74"
authors = [
{ name="Zeke Ahern", email="z.ahern@qut.edu.au" },
]
description = "Automated discrete choice model search: JAX-accelerated MLE, Simulated Annealing & Harmony Search over MNL, Mixed Logit, RRM, and Mixed-RRM specifications."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
]
dependencies = [
    'numpy',
    'scipy>=1.10.0',
    'pandas>=2.0.0',
    'scikit-learn>=1.3.1',
    'statsmodels',
    'pyfiglet',
    'addicty',
    'matplotlib',
    'jax>=0.4.1',
    'jaxlib>=0.4.1',
    'sympy',
    'colorama',
]

[tool.setuptools.packages]
find = { where = ["src"] }



[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]


[project.urls]
Homepage = "https://github.com/zahern/HypothesisX"

[project.scripts]
realpython = "SearchLibrium.__main__:main"


[tool.bumpver]
current_version = "0.0.74"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "Bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = false


[tool.bumpver.file_patterns] 
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"'] 
"SearchLibrium/__init__.py" = ["{version}"]