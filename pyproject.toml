[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "src/SearchLibrium/version.txt"}

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
SearchLibrium = ["data/*.csv"]

[project]
name = "SearchLibrium"
dynamic = ["version"]
description = "A Python package for econometric models driven by search"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Zeke Ahern", email = "z.ahern@qut.edu.au" },
    { name = "Mario Fernando Taco Morales" },
    { name = "Alexander Paz" },
    { name = "Prithvi Beeramole" },
    { name = "Robert Burdett" },
]
keywords = [
    "econometric models",
    "search",
    "discrete choice",
    "logit",
    "probit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0,<2.3",
    "pandas>=2.0.0",
    "scipy>=1.10",
    "scikit-learn>=1.3.1",
    "statsmodels",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
    "addicty",
    "pyfiglet",
    "colorama",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "pytest",
]

[project.urls]
Homepage = "https://pypi.org/project/SearchLibrium/"
Repository = "https://github.com/zahern/HypothesisX"
Issues = "https://github.com/zahern/HypothesisX/issues"
Documentation = "https://pypi.org/project/SearchLibrium/"

[project.scripts]
realpython = "SearchLibrium.__main__:main"

[tool.bumpver]
current_version = "0.0.182"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "[skip ci] Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"src/SearchLibrium/version.txt" = ["{version}"]