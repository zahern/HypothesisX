[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "src/SearchLibrium/version.txt"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["SearchLibrium*"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
SearchLibrium = ["data/*.csv"]

[project]
name = "SearchLibrium"
dynamic = ["version"]
description = "Automated specification search for discrete choice models (logit, mixed logit, nested logit, RRM and more) using metaheuristic optimisation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zeke Ahern", email = "z.ahern@qut.edu.au" },
    { name = "Mario Fernando Taco Morales" },
    { name = "Alexander Paz" },
    { name = "Prithvi Beeramole" },
    { name = "Robert Burdett" },
]
keywords = [
    "econometrics",
    "discrete choice",
    "choice modelling",
    "logit",
    "mixed logit",
    "nested logit",
    "random regret minimisation",
    "model specification search",
    "simulated annealing",
    "metaheuristics",
    "maximum likelihood",
    "transport modelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # Accept the whole numpy 2.x line. The old <2.3 cap forced pip to backtrack
    # to an ancient release (0.0.105) on environments carrying numpy 2.3.x, since
    # nothing newer satisfied the cap. numpy 2.3.x is exercised by the HPC jobs;
    # the <3 guard still excludes a potentially breaking numpy 3.0.
    "numpy>=2.0,<3",
    "pandas>=2.0.0",
    "scipy>=1.10",
    "scikit-learn>=1.3.1",
    "statsmodels",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
    "addicty",
    "pyfiglet",
    "colorama",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.5",
]
dev = [
    "black",
    "bumpver",
    "isort",
    "pip-tools",
    "pytest",
]

[project.urls]
Homepage = "https://pypi.org/project/SearchLibrium/"
Repository = "https://github.com/zahern/HypothesisX"
Issues = "https://github.com/zahern/HypothesisX/issues"
Documentation = "https://pypi.org/project/SearchLibrium/"

[project.scripts]
realpython = "SearchLibrium.__main__:main"

[tool.bumpver]
current_version = "0.0.203"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "[skip ci] Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"src/SearchLibrium/version.txt" = ["{version}"]