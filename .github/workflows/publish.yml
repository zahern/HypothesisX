name: Publish to PyPI

# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# 1. Automatically when a version tag (v*.*.*) is pushed to main
# 2. Manually via the GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Permissions
# • id-token: write  – required for PyPI OIDC Trusted Publishing
# • contents: read   – default, needed for checkout
#
# SETUP INSTRUCTIONS (choose one):
# ──────────────────────────────────────────────────────────────────────────────
# Option A – OIDC Trusted Publishing (no API token needed, most secure)
#   1. Go to https://pypi.org/manage/project/SearchLibrium/settings/publishing/
#   2. Add a new "GitHub Actions" trusted publisher:
#        • Owner:     zahern
#        • Repo:      HypothesisX
#        • Workflow:  publish.yml
#        • Env name:  pypi
#   3. Keep the 'password' line below commented out.
#
# Option B – API token (simpler, works immediately)
#   1. Create a PyPI API token at https://pypi.org/manage/account/token/
#   2. Add it as a repository secret named PYPI_API_TOKEN:
#        GitHub repo → Settings → Secrets → Actions → New repository secret
#   3. Un-comment the 'password:' line in the publish step below.
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  id-token:  write     # required for PyPI OIDC Trusted Publishing (Option A)

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build the source distribution and wheel
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so bumpver / git describe work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Validate version metadata
        # Guard against the 2026-09-16 failure: a manual merge committed
        # conflict markers into version.txt (both sides had bumped the same
        # version), setuptools then failed the build with an opaque error and
        # nothing reached PyPI. Fail here, with the reason, instead.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path("src/SearchLibrium/version.txt").read_text()
          if any(m in raw for m in ("<<<<<<<", ">>>>>>>", "=======")):
              sys.exit("FATAL: merge conflict markers in "
                       "src/SearchLibrium/version.txt - resolve the merge "
                       "before publishing (take one side, delete the markers).")
          ver = raw.strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+([.+-].+)?", ver):
              sys.exit(f"FATAL: version.txt is not a valid version: {ver!r}")
          pyproject = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r'current_version\s*=\s*"([^"]+)"', pyproject)
          if m and m.group(1) != ver:
              sys.exit(f"FATAL: version.txt ({ver}) != pyproject.toml "
                       f"current_version ({m.group(1)}) - run bumpver or fix "
                       "by hand before publishing.")
          print(f"version metadata OK: {ver}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Publish to PyPI (skipped on dry runs)
  # Uses PyPI Trusted Publishing — no API token stored in secrets.
  # Set up once at https://pypi.org/manage/project/SearchLibrium/settings/publishing/
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')

    environment:
      name: pypi
      url: https://pypi.org/project/SearchLibrium/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # ── AUTHENTICATION ────────────────────────────────────────────────────
        # OIDC Trusted Publishing (no secret needed, cannot expire).
        # Requires the trusted publisher on PyPI (one-time setup):
        #   https://pypi.org/manage/project/SearchLibrium/settings/publishing/
        #   Owner:    zahern   Repo: HypothesisX
        #   Workflow: publish.yml   Environment: pypi
        # (Legacy token path removed 2026-09-07 after repeated 403s from a
        # stale PYPI_API_TOKEN secret. To go back: re-add
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }})
        # ─────────────────────────────────────────────────────────────────────
