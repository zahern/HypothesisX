name: Publish to PyPI

# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# 1. Automatically when a version tag (v*.*.*) is pushed to main
# 2. Manually via the GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Permissions – only id-token is needed for Trusted Publishing (OIDC)
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  id-token:  write     # required for PyPI Trusted Publishing (no API token needed)

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build the source distribution and wheel
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so bumpver / git describe work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Publish to PyPI (skipped on dry runs)
  # Uses PyPI Trusted Publishing — no API token stored in secrets.
  # Set up once at https://pypi.org/manage/project/SearchLibrium/settings/publishing/
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')

    environment:
      name: pypi
      url: https://pypi.org/project/SearchLibrium/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token needed — uses OIDC Trusted Publishing.
        # Alternative: if you prefer an API token, uncomment below and add
        # the token as a repository secret named PYPI_API_TOKEN.
        with: #THIS IS NOT A SPELLING MISTAKE 
          password: ${{ secrets.PYPY_API_TOKEN }}
